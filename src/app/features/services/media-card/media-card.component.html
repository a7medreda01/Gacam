<!-- زر الطباعة -->
<div class="flex justify-center mb-3 print-hidden">
    <button (click)="printCardAsPdf()" class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-semibold
           bg-[#0d3d3d] text-[#c9a84c] border border-[#c9a84c]
           hover:bg-[#c9a84c] hover:text-[#0d3d3d] transition-colors">
        <mat-icon class="text-base h-4 w-4">download</mat-icon>
        {{ lang === 'ar' ? 'تحميل البطاقة PDF' : 'Download Card PDF' }}
    </button>
</div>

<div class="flex items-center justify-center gap-2 mb-6">
    <span class="h-px flex-1 bg-emerald-200"></span>
    <div
        class="flex items-center gap-1.5 text-emerald-700 bg-emerald-50 border border-emerald-200 px-4 py-1.5 rounded-full">
        <mat-icon class="text-base h-4 w-4">verified</mat-icon>
        <span class="text-[11px] font-extrabold uppercase tracking-widest">
            {{ lang === 'ar' ? 'اعتماد رسمي مفعّل' : 'GACAM Official Verified Member' }}
        </span>
    </div>
    <span class="h-px flex-1 bg-emerald-200"></span>
</div>

<!-- ── Flip Card ── -->
<div class="card-scene" dir="ltr">
    <div class="card-inner">

        <!-- ══ FRONT ══ -->
        <div class="card-face">
            <svg #frontSvg viewBox="0 0 300 530" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <clipPath id="cf">
                        <rect width="300" height="530" rx="20" />
                    </clipPath>
                    <clipPath id="profileClip">
                        <circle cx="150" cy="228" r="54" />
                    </clipPath>
                    <linearGradient id="gs" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#8a6520" />
                        <stop offset="40%" stop-color="#e8c870" />
                        <stop offset="100%" stop-color="#8a6520" />
                    </linearGradient>
                    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#0d4a4a" />
                        <stop offset="100%" stop-color="#072530" />
                    </linearGradient>
                </defs>
                <g clip-path="url(#cf)">

                    <!-- cream bg -->
                    <rect width="300" height="530" fill="#ede8d8" />

                    <!-- world map dots subtle -->
                    <!-- <text x="150" y="320" text-anchor="middle" font-size="130" fill="rgba(13,61,61,0.055)">🌍</text> -->

                    <!-- dark header — curved bottom -->
                    <path d="M0,0 L300,0 L300,195 Q150,240 0,195 Z" fill="url(#headerGrad)" />

                    <!-- gold wave lines in header -->
                    <path fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.5"
                        d="M-5,60 Q50,35 110,65 Q170,95 230,55 Q270,35 305,50" />
                    <path fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.3"
                        d="M-5,80 Q55,55 115,82 Q175,110 235,72 Q270,52 305,68" />
                    <path fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.45"
                        d="M180,20 Q220,50 240,90 Q255,120 245,155" />
                    <path fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.25"
                        d="M195,15 Q238,48 258,92 Q272,122 262,158" />

                    <!-- lanyard notch -->
                    <rect x="122" y="7" width="56" height="14" rx="7" fill="#061e1e" />
                    <rect x="127" y="10" width="46" height="8" rx="4" fill="#0d3d3d" stroke="#c9a84c"
                        stroke-width="0.5" />

                    <!-- LOGO -->
                    <image [attr.href]="logoBase64 ?? 'logo.png'" x="120" y="30" width="60" height="60" />

                    <!-- GACAM -->
                    <text x="150" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="20"
                        font-weight="bold" letter-spacing="8" fill="#ffffff">GACAM</text>
                    <text x="150" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5"
                        letter-spacing="1.5" fill="rgba(201,168,76,0.9)">GULF &amp; ARAB GENERAL COMMISSION</text>
                    <text x="150" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5"
                        letter-spacing="1.5" fill="rgba(201,168,76,0.9)">FOR AUDIOVISUAL MEDIA</text>

                    <!-- profile photo -->
                    <circle cx="150" cy="228" r="56" fill="#0d3d3d" stroke="#c9a84c" stroke-width="2.5" />
                    @if (userProfileImageUrl) {
                    <image [attr.href]="profileBase64 ?? userProfileImageUrl" x="96" y="174" width="108" height="108"
                        clip-path="url(#profileClip)" preserveAspectRatio="xMidYMid slice" />
                    } @else {
                    <circle cx="150" cy="216" r="22" fill="#3d6e6e" />
                    <ellipse cx="150" cy="248" rx="32" ry="22" fill="#3d6e6e" />
                    }

                    <!-- name + category -->
                    <text x="150" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="14"
                        font-weight="bold" fill="#0d3d3d" letter-spacing="0.5">{{ application.userFullName }}</text>
                    <text x="150" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="9"
                        letter-spacing="2" fill="#c9a84c" font-weight="bold">{{ categoryLabel }}</text>

                    <!-- divider -->
                    <line x1="30" y1="328" x2="270" y2="328" stroke="#c9a84c" stroke-width="0.6" opacity="0.45" />

                    <!-- ID / Card Number -->
                    <rect x="30" y="335" width="24" height="24" rx="5" fill="#0d3d3d" />
                    <rect x="33" y="338" width="18" height="13" rx="2" fill="none" stroke="#c9a84c" stroke-width="1" />
                    <line x1="36" y1="342" x2="48" y2="342" stroke="#c9a84c" stroke-width="0.8" />
                    <line x1="36" y1="345" x2="45" y2="345" stroke="#c9a84c" stroke-width="0.8" />
                    <line x1="60" y1="335" x2="60" y2="359" stroke="#c9a84c" stroke-width="0.4" opacity="0.4" />
                    <text x="67" y="351" font-family="Arial,sans-serif" font-size="10" fill="#2a2a2a">
                        ID : {{ application.mediaCard?.cardNumber ?? '—' }}
                    </text>
                    <line x1="60" y1="359" x2="270" y2="359" stroke="#c9a84c" stroke-width="0.4" opacity="0.3" />

                    <!-- Department / Category -->
                    <rect x="30" y="364" width="24" height="24" rx="5" fill="#0d3d3d" />
                    <circle cx="40" cy="371" r="4" fill="none" stroke="#c9a84c" stroke-width="1" />
                    <path d="M33,380 Q40,375 47,380" fill="none" stroke="#c9a84c" stroke-width="1" />
                    <line x1="60" y1="364" x2="60" y2="388" stroke="#c9a84c" stroke-width="0.4" opacity="0.4" />
                    <text x="67" y="380" font-family="Arial,sans-serif" font-size="10" fill="#2a2a2a">
                        Department : {{ categoryLabel }}
                    </text>
                    <line x1="60" y1="388" x2="270" y2="388" stroke="#c9a84c" stroke-width="0.4" opacity="0.3" />

                    <!-- Date of Issue -->
                    <rect x="30" y="393" width="24" height="24" rx="5" fill="#0d3d3d" />
                    <rect x="33" y="396" width="18" height="16" rx="2" fill="none" stroke="#c9a84c" stroke-width="1" />
                    <line x1="33" y1="400" x2="51" y2="400" stroke="#c9a84c" stroke-width="0.8" />
                    <line x1="60" y1="393" x2="60" y2="417" stroke="#c9a84c" stroke-width="0.4" opacity="0.4" />
                    <text x="67" y="409" font-family="Arial,sans-serif" font-size="10" fill="#2a2a2a">
                        Date of Issue : {{ application.mediaCard?.issuedAt | date:'dd / MM / yyyy' }}
                    </text>
                    <line x1="60" y1="417" x2="270" y2="417" stroke="#c9a84c" stroke-width="0.4" opacity="0.3" />

                    <!-- Date of Expiry -->
                    <rect x="30" y="422" width="24" height="24" rx="5" fill="#0d3d3d" />
                    <rect x="33" y="425" width="18" height="16" rx="2" fill="none" stroke="#c9a84c" stroke-width="1" />
                    <line x1="33" y1="429" x2="51" y2="429" stroke="#c9a84c" stroke-width="0.8" />
                    <rect x="36" y="432" width="3" height="3" fill="#c9a84c" />
                    <line x1="60" y1="422" x2="60" y2="446" stroke="#c9a84c" stroke-width="0.4" opacity="0.4" />
                    <text x="67" y="438" font-family="Arial,sans-serif" font-size="10" fill="#2a2a2a">
                        Date of Expiry : {{ application.mediaCard?.expiresAt | date:'dd / MM / yyyy' }}
                    </text>
                    <line x1="60" y1="446" x2="270" y2="446" stroke="#c9a84c" stroke-width="0.4" opacity="0.3" />

                    <!-- QR Code -->
                    @if (application.mediaCard?.qrCodeData && qrDataUrl) {
                    <rect x="30" y="452" width="52" height="52" rx="5" fill="white" stroke="#c9a84c"
                        stroke-width="0.8" />
                    @if (qrDataUrl) {
                    <image [attr.href]="qrDataUrl" x="33" y="455" width="46" height="46"
                        preserveAspectRatio="xMidYMid meet" />
                    } @else {
                    <rect x="33" y="455" width="46" height="46" rx="3" fill="#e8e0cc" />
                    }
                    }

                    <!-- signature line + text -->
                    <line x1="155" y1="470" x2="270" y2="470" stroke="#c9a84c" stroke-width="0.7" opacity="0.6" />
                    <text x="212" y="464" text-anchor="middle" font-family="'Brush Script MT','Segoe Script',cursive"
                        font-size="14" fill="#1a3d3d">J. AlMajed</text>
                    <text x="212" y="481" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#555"
                        letter-spacing="0.3">
                        {{ lang === 'ar' ? 'المدير العام' : 'Director General' }}
                    </text>

<!-- diamond bottom divider -->
<polygon points="150,508 154,512 150,516 146,512" fill="#c9a84c" />

<!-- gold stripe + footer -->
<rect y="508" width="300" height="4" fill="url(#gs)" />
<rect y="512" width="300" height="18" fill="#061e1e" />

<text x="150" y="525" text-anchor="middle"
      font-family="Arial,sans-serif" font-size="8"
      letter-spacing="3" fill="#c9a84c" font-weight="bold">
    One Media • One Future
</text>
                </g>
            </svg>
        </div>

        <!-- ══ BACK ══ -->
        <div class="card-face card-back">
            <svg #backSvg viewBox="0 0 300 530" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <clipPath id="cb">
                        <rect width="300" height="530" rx="20" />
                    </clipPath>
                    <linearGradient id="gsb" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#8a6520" />
                        <stop offset="40%" stop-color="#e8c870" />
                        <stop offset="100%" stop-color="#8a6520" />
                    </linearGradient>
                    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#0d4a4a" />
                        <stop offset="100%" stop-color="#072530" />
                    </linearGradient>
                    <filter id="recolor">
                        <feColorMatrix type="saturate" values="0" />
                        <feColorMatrix type="matrix" values="0.79 0 0 0 0
                          0.63 0 0 0 0
                          0.30 0 0 0 0
                          0    0 0 1 0" />
                    </filter>
                </defs>
                <g clip-path="url(#cb)">

                    <!-- full dark bg -->
                    <rect width="300" height="530" fill="url(#bgGrad)" />

                    <!-- world map subtle -->
                    <!-- <text x="150" y="280" text-anchor="middle" font-size="200" fill="rgba(255,255,255,0.03)">🌍</text> -->

                    <!-- wave top right -->
                    <path fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"
                        d="M160,0 Q200,30 220,70 Q235,100 225,140" />
                    <path fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.22"
                        d="M178,0 Q220,32 240,75 Q255,105 245,145" />
                    <!-- wave bottom left -->
                    <path fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"
                        d="M-5,360 Q40,340 90,365 Q140,390 180,360 Q210,342 240,355" />
                    <path fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.22"
                        d="M-5,378 Q40,358 90,382 Q140,406 180,376 Q210,358 240,372" />

                    <!-- lanyard notch -->
                    <rect x="122" y="7" width="56" height="14" rx="7" fill="#061e1e" />
                    <rect x="127" y="10" width="46" height="8" rx="4" fill="#0d4a4a" stroke="#c9a84c"
                        stroke-width="0.5" />

                    <!-- LOGO -->
                    <image [attr.href]="logoBase64 ?? 'logo.png'" x="120" y="30" width="60" height="60" />

                    <!-- GACAM -->
                    <text x="150" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="20"
                        font-weight="bold" letter-spacing="8" fill="#ffffff">GACAM</text>
                    <text x="150" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5"
                        letter-spacing="1.5" fill="rgba(201,168,76,0.9)">GULF &amp; ARAB GENERAL COMMISSION</text>
                    <text x="150" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5"
                        letter-spacing="1.5" fill="rgba(201,168,76,0.9)">FOR AUDIOVISUAL MEDIA</text>

                    <!-- diamond divider 1 -->
                    <line x1="30" y1="143" x2="128" y2="143" stroke="#c9a84c" stroke-width="0.7" opacity="0.5" />
                    <polygon points="150,138 156,143 150,148 144,143" fill="#c9a84c" />
                    <line x1="172" y1="143" x2="270" y2="143" stroke="#c9a84c" stroke-width="0.7" opacity="0.5" />

                    <!-- certification text -->
                    <text x="150" y="170" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#e8dfc0"
                        letter-spacing="0.3">
                        This card certifies that the bearer
                    </text>
                    <text x="150" y="186" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#e8dfc0"
                        letter-spacing="0.3">
                        is an officially accredited representative.
                    </text>

                    <!-- diamond divider 2 -->
                    <line x1="60" y1="200" x2="128" y2="200" stroke="#c9a84c" stroke-width="0.7" opacity="0.4" />
                    <polygon points="150,195 156,200 150,205 144,200" fill="#c9a84c" />
                    <line x1="172" y1="200" x2="240" y2="200" stroke="#c9a84c" stroke-width="0.7" opacity="0.4" />

                    <text x="150" y="224" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#e8dfc0"
                        letter-spacing="0.3">
                        It facilitates the execution of their
                    </text>
                    <text x="150" y="240" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#e8dfc0"
                        letter-spacing="0.3">
                        professional responsibilities.
                    </text>

                    <!-- diamond divider 3 -->
                    <line x1="60" y1="254" x2="128" y2="254" stroke="#c9a84c" stroke-width="0.7" opacity="0.4" />
                    <polygon points="150,249 156,254 150,259 144,254" fill="#c9a84c" />
                    <line x1="172" y1="254" x2="240" y2="254" stroke="#c9a84c" stroke-width="0.7" opacity="0.4" />

                    <text x="150" y="278" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#e8dfc0"
                        letter-spacing="0.3">
                        All concerned authorities are requested
                    </text>
                    <text x="150" y="294" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#e8dfc0"
                        letter-spacing="0.3">
                        to extend full cooperation.
                    </text>

                    <!-- divider line -->
                    <line x1="30" y1="310" x2="270" y2="310" stroke="#c9a84c" stroke-width="0.6" opacity="0.35" />

                    <!-- website icon -->
                    <circle cx="42" cy="330" r="9" fill="none" stroke="#c9a84c" stroke-width="1.1" />
                    <ellipse cx="42" cy="330" rx="4" ry="9" fill="none" stroke="#c9a84c" stroke-width="0.8" />
                    <line x1="33" y1="330" x2="51" y2="330" stroke="#c9a84c" stroke-width="0.8" />
                    <text x="56" y="334" font-family="Arial,sans-serif" font-size="10"
                        fill="#d4c49a">www.gacam.ca</text>

                    <!-- email 1 icon -->
                    <rect x="33" y="347" width="18" height="13" rx="2.5" fill="none" stroke="#c9a84c"
                        stroke-width="1.1" />
                    <polyline points="33,347 42,355 51,347" fill="none" stroke="#c9a84c" stroke-width="0.9" />
                    <text x="56" y="357" font-family="Arial,sans-serif" font-size="10"
                        fill="#d4c49a">info@gacam.media</text>

                    <!-- vertical separator -->
                    <line x1="158" y1="320" x2="158" y2="375" stroke="#c9a84c" stroke-width="0.5" opacity="0.4" />

                    <!-- email 2 icon -->
                    <rect x="168" y="323" width="18" height="13" rx="2.5" fill="none" stroke="#c9a84c"
                        stroke-width="1.1" />
                    <polyline points="168,323 177,331 186,323" fill="none" stroke="#c9a84c" stroke-width="0.9" />
                    <text x="192" y="333" font-family="Arial,sans-serif" font-size="10"
                        fill="#d4c49a">media@gacam.ca</text>

                    <!-- social icons row -->
                    <!-- Instagram -->
                    <rect x="168" y="347" width="18" height="18" rx="4" fill="none" stroke="#c9a84c"
                        stroke-width="1.1" />
                    <circle cx="177" cy="356" r="4.5" fill="none" stroke="#c9a84c" stroke-width="0.9" />
                    <circle cx="183" cy="350" r="1.5" fill="#c9a84c" />
                    <!-- X -->
                    <text x="196" y="364" font-family="Arial,sans-serif" font-size="16" font-weight="bold"
                        fill="#c9a84c">𝕏</text>
                    <!-- YouTube -->
                    <rect x="214" y="347" width="22" height="16" rx="3.5" fill="none" stroke="#c9a84c"
                        stroke-width="1.1" />
                    <polygon points="220,351 228,355 220,359" fill="#c9a84c" />

                    <text x="195" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="9"
                        fill="#c9a84c" letter-spacing="0.8">&#64;gacam.media</text>

                    <!-- Canadian maple leaf -->
                    <text x="150" y="420" text-anchor="middle" font-size="28" fill="#c9a84c"
                        filter="url(#recolor)">🍁</text>

                    <!-- lines around leaf -->
                    <line x1="30" y1="435" x2="116" y2="435" stroke="#c9a84c" stroke-width="0.6" opacity="0.5" />
                    <line x1="184" y1="435" x2="270" y2="435" stroke="#c9a84c" stroke-width="0.6" opacity="0.5" />

                    <!-- gold stripe + footer -->
                    <rect y="480" width="300" height="4" fill="url(#gsb)" />
                    <rect y="484" width="300" height="32" fill="#061e1e" />
                    <text x="150" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="10"
                        letter-spacing="2" fill="#c9a84c">One Media • One Future</text>

                </g>
            </svg>
        </div>

    </div>
</div>
