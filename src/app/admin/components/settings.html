<div class="flex flex-col gap-6 animate-fade-in text-start">
  <div>
    <h2 id="settings-management-title" class="text-xl font-bold uppercase text-royal-teal tracking-wide">
      Global Site Parameters
    </h2>
    <p class="text-xs text-deep-teal/60 font-sans">Visual branding seal alignment and official signatory parameters for E-Certificates</p>
  </div>

  @if (loading()) {
    <div id="loading-spinner" class="h-64 flex items-center justify-center animate-pulse font-semibold">
      Loading visual nodes settings...
    </div>
  } @else {
    <div id="settings-card" class="bg-white p-6 sm:p-8 rounded-2xl border border-champagne-gold/15 shadow-sm text-start max-w-2xl">
      <h3 class="text-sm font-bold border-b border-light-ivory pb-2 uppercase tracking-wide text-royal-teal mb-6">Visual branding &amp; Certificates parameters</h3>

      <form [formGroup]="settForm" (ngSubmit)="onSaveSettings()" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
          <label for="settings-sig" class="text-xs font-bold text-deep-teal">Issuer Principal Signatory *</label>
          <input id="settings-sig" type="text" formControlName="signatoryName" class="px-4 py-2 border border-champagne-gold/30 rounded-lg text-xs bg-light-ivory focus:outline-royal-teal focus:ring-1 focus:ring-royal-teal" placeholder="e.g. Executive Director Committee" />
        </div>
        <!-- Courier Charge -->
        <div class="flex flex-col gap-1">
          <label for="settings-seal" class="text-xs font-bold text-deep-teal">Issuer seal visual path (Absolute URL) *</label>
          <input id="settings-seal" type="text" formControlName="sealPhotoUrl" class="px-4 py-2 border border-champagne-gold/30 rounded-lg text-xs bg-light-ivory focus:outline-royal-teal focus:ring-1 focus:ring-royal-teal font-sans" />
        </div>

        <button type="submit" [disabled]="settForm.invalid" class="px-4 py-2 bg-royal-teal text-white font-bold hover:bg-champagne-gold hover:text-royal-teal rounded text-xs cursor-pointer mt-2 transition-colors">
          Update Settings Node
        </button>
      </form>
    </div>
  }
</div>
